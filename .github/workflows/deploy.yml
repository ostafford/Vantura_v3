name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: npm audit
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            npm audit --omit=dev --audit-level=critical && exit 0
            echo "npm audit attempt $i failed, retrying..."
            sleep 10
          done
          echo "::warning::npm audit failed after 3 attempts (likely registry-side issue) — not blocking the build"
          exit 1
      - run: npm run build
